name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
    - name: Wait for test Python 3.12
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.ref }}
        check-name: 'test (3.12)'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 20
        allowed-conclusions: success

    - name: Wait for test Python 3.13
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.ref }}
        check-name: 'test (3.13)'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 20
        allowed-conclusions: success

    - name: Wait for docs to build
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.ref }}
        check-name: 'build'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 20
        allowed-conclusions: success

    # Build and publish steps
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build package
      run: uv build

    # Tokenless via PyPI Trusted Publishing (OIDC, id-token: write above).
    # Configure the publisher on pypi.org (project m3s -> Publishing) with this
    # repo, workflow `publish_pypi.yml`, and the `release` environment.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # npm provenance attestation
      contents: read

    steps:
    - name: Wait for JS parity
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.ref }}
        check-name: 'js-parity'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 20
        allowed-conclusions: success

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'

    # Trusted Publishing (OIDC) needs npm >= 11.5. Pin to npm@11 rather than
    # @latest: npm@12 has a broken global-install that drops the optional
    # `sigstore` dep, breaking provenance/publish (MODULE_NOT_FOUND: sigstore).
    - name: Upgrade npm for OIDC trusted publishing
      run: npm install -g npm@11

    # The published package bundles both targets: pkg (Node/CJS) and pkg-web
    # (browser/ESM). The exports map in bindings/js/package.json picks one.
    - name: Build WASM (node + web targets)
      run: |
        wasm-pack build bindings/js --target nodejs --out-dir pkg
        wasm-pack build bindings/js --target web    --out-dir pkg-web

    - name: Stamp version from tag
      run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      working-directory: bindings/js

    # No token: authenticated via OIDC trusted publishing (id-token: write).
    # Configure the trusted publisher on npmjs.com (repo + this workflow +
    # the `release` environment) before the first OIDC publish.
    - name: Publish to npm
      run: npm publish
      working-directory: bindings/js