name: Tests

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2

    # m3s imports the shared Rust core (m3s_core); build its wheel for the
    # matrix interpreter and overlay it onto the test env via --with.
    - name: Build m3s_core wheel
      run: >
        uv run --python ${{ matrix.python-version }} --no-project --with maturin
        maturin build --release -m bindings/python/Cargo.toml -o dist -i python

    - name: Run tests (with coverage)
      if: matrix.python-version == '3.13'
      run: >
        uv run --python ${{ matrix.python-version }} --no-default-groups --extra test
        --with dist/m3s_core-*.whl
        pytest tests/ -v --cov=m3s --cov-report=xml --cov-report=term

    - name: Run tests
      if: matrix.python-version != '3.13'
      run: >
        uv run --python ${{ matrix.python-version }} --no-default-groups --extra test
        --with dist/m3s_core-*.whl
        pytest tests/ -v

    - name: Upload coverage
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # JS half of the ADR 0001 parity gate: build the wasm binding from the same
  # core and replay the committed golden vectors, proving JS == Python.
  js-parity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0

    - name: Build wasm binding (nodejs target)
      run: wasm-pack build bindings/js --target nodejs --out-dir pkg

    - name: Run JS parity
      run: node tests/js/parity.cjs

    - name: Run JS wrapper parity
      run: node tests/js/wrapper_parity.mjs

  # Summary job that all matrix jobs must pass
  tests-complete:
    runs-on: ubuntu-24.04
    needs: [test, js-parity]
    steps:
    - name: All tests passed
      run: echo "All test matrix jobs completed successfully"
