name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per ref
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0

    # m3s imports the shared Rust core (m3s_core); the gallery examples also
    # embed the web-target wasm build (bindings/js/pkg-web, gitignored).
    - name: Build m3s_core wheel
      run: >
        uv run --no-project --with maturin
        maturin build --release -m bindings/python/Cargo.toml -o dist -i python

    - name: Build wasm binding (web target)
      run: wasm-pack build bindings/js --target web --out-dir pkg-web

    - name: Build documentation
      working-directory: docs
      run: >
        uv run --no-default-groups --extra docs --with ../dist/m3s_core-*.whl
        sphinx-build -b html . _build/html --keep-going
    
    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4