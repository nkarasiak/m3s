[package]
name = "m3s-core"
version = "0.0.0"
edition = "2021"
description = "Shared grid math for m3s (Python + JS). P0 tracer: geohash + h3."
license = "MIT"

[dependencies]
geohash = "0.13"
geo-types = "0.7"
# `geo` feature: h3o's polygon tiler (geom::TilerBuilder) for h3 cells_in_bbox.
h3o = { version = "0.7", features = ["geo"] }
geoconvert = "1.0.2"
a5 = "0.8.0"
# default-features off drops `float_extras` (libc FFI math, won't build to WASM)
# and `serde`; neither is on our cell/id/ring/neighbour/child/parent path.
s2 = { version = "0.0.13", default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bbox"
harness = false
